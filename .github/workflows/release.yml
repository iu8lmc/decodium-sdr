# Pacchetti di release (RNF-04): un binario per piattaforma.
#
# Si attiva sui tag storici `v*` e sui tag numerici del progetto, e pubblica
# una release in bozza con AppImage, DMG e ZIP portable. La bozza è voluta: le
# note di rilascio le scrive una persona, e il pacchetto va provato prima di
# renderlo pubblico.
name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  # Senza input: la versione viene dal progetto, e un campo obbligatorio che
  # nessuno step legge è solo un ostacolo fra chi vuole provare il
  # confezionamento e il workflow. Lanciato a mano costruisce i pacchetti
  # e li carica come artifact, senza creare alcuna release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage (x86-64)
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact: decodium-sdr-linux-x86_64.AppImage
          - name: Linux AppImage (ARM64)
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            artifact: decodium-sdr-linux-aarch64.AppImage
          - name: macOS DMG (Apple Silicon)
            os: macos-14
            platform: macos
            arch: arm64
            artifact: decodium-sdr-macos-arm64.dmg
          - name: macOS DMG (Intel)
            os: macos-15-intel
            platform: macos
            arch: x86_64
            artifact: decodium-sdr-macos-x86_64.dmg
          - name: Windows (installer + ZIP)
            os: windows-latest
            platform: windows
            arch: x86_64
            artifact: decodium-sdr-windows-x86_64-setup.exe

    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      # ── Dipendenze ──────────────────────────────────────────────────────
      # Versione e nome, una volta sola: li leggono tutti i passi che
      # confezionano, e ricavarli tre volte con tre `grep` diversi e' il modo
      # in cui prima o poi due pacchetti della stessa build escono con due
      # nomi diversi.
      - name: Versione e nome
        shell: bash
        run: |
          VERSION=$(grep -m1 -E '^\s+VERSION [0-9]' CMakeLists.txt | tr -dc '0-9.')
          NAME=$(sed -n 's/^[[:space:]]*set(DSDR_VERSION_NAME[[:space:]]*"\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)
          # Un nome vuoto o lungo come una frase vuol dire che l'estrazione ha
          # preso la cosa sbagliata. Fermarsi qui costa un minuto; accorgersene
          # dalla pagina della release costa quaranta minuti di build.
          if [ -z "$NAME" ] || [ ${#NAME} -gt 24 ]; then
            echo "::error::nome della versione non plausibile: «$NAME»"
            exit 1
          fi

          echo "DSDR_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DSDR_NAME=$NAME" >> "$GITHUB_ENV"
          # Lo spazio sparisce dal nome del file e resta nel titolo: un nome
          # come «De Forest» e' come si chiamava quella persona, ma dentro un
          # nome di file si spezza in due alla prima riga di comando.
          echo "DSDR_TAG=${VERSION}_${NAME// /}" >> "$GITHUB_ENV"
          echo "versione $VERSION, nome $NAME"

      - name: Dipendenze di sistema (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libfftw3-dev libsoapysdr-dev \
            soapysdr-module-rtlsdr soapysdr-module-hackrf \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libegl1-mesa-dev libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libpulse-dev libhamlib-utils pulseaudio \
            libgstreamer-plugins-bad1.0-0

      - name: Qt 6.8 (Linux)
        if: matrix.platform == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtshadertools'
          cache: true

      - name: Dipendenze (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew update
          brew install qt@6 fftw ninja soapysdr soapyrtlsdr soapyhackrf hamlib
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"
          echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

      - name: Dipendenze (Windows/MSYS2)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-soapysdr
            mingw-w64-x86_64-soapyrtlsdr
            mingw-w64-x86_64-soapyhackrf
            mingw-w64-x86_64-nsis
            unzip
            zip

      # MSYS2 non pubblica più un pacchetto Hamlib per MINGW64. Il runtime
      # ufficiale x64 conserva invece rigctld e l'intero catalogo radio; lo
      # fissiamo a versione e SHA-256, perché un bridge CAT diverso da quello
      # verificato renderebbe il pacchetto non riproducibile.
      - name: Runtime Hamlib ufficiale (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          HAMLIB_VERSION=4.7.2
          ARCHIVE="third_party/hamlib-w64-${HAMLIB_VERSION}.zip"
          URL="https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-w64-${HAMLIB_VERSION}.zip"
          # Digest pubblicato nell'API ufficiale della release Hamlib 4.7.2.
          WANT=8553bc6c5c6032e8debf99c017e98f58fed7e07e7c25d04815dc3e8bbe3304c7
          mkdir -p third_party
          curl -fsSL "$URL" -o "$ARCHIVE"
          GOT=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::il runtime Hamlib scaricato non è quello atteso"
            echo "  atteso:    $WANT"
            echo "  scaricato: $GOT"
            exit 1
          fi
          unzip -q "$ARCHIVE" -d third_party
          HAMLIB_BIN="$PWD/third_party/hamlib-w64-${HAMLIB_VERSION}/bin"
          test -x "$HAMLIB_BIN/rigctld.exe"
          echo "$HAMLIB_BIN" >> "$GITHUB_PATH"
          echo "Hamlib ${HAMLIB_VERSION} x64 verificato: $GOT"

      # La libreria del ColibriNANO. È del costruttore ma è rilasciata sotto
      # Unlicense — «free to copy, publish, distribute... either in source code
      # form or as a compiled binary» — quindi può stare nei nostri pacchetti,
      # e senza di lei chi installa un pacchetto e collega la radio non vede
      # niente: il backend c'è, non trova device, e l'elenco resta vuoto.
      #
      # Si scarica invece di vivere nel repository, perché un binario di terzi
      # versionato è un binario che nessuno riguarda più. Ma non si prende alla
      # cieca: l'impronta è fissata qui, e se il file all'origine cambia la
      # costruzione si ferma. Stiamo mettendo codice di qualcun altro dentro
      # un pacchetto che firmiamo noi.
      #
      # Il costruttore pubblica la libreria Linux soltanto x86-64. Non la
      # copiamo nell'AppImage ARM64: un binario dell'architettura sbagliata
      # farebbe comparire un backend che non può aprire la radio.
      # macOS non ha una versione della libreria.
      - name: Libreria ColibriNANO
        if: matrix.platform == 'windows' || (matrix.platform == 'linux' && matrix.arch == 'x86_64')
        shell: bash
        run: |
          BASE=https://raw.githubusercontent.com/maksimus1210/ColibriNANO_lib/master/library
          mkdir -p third_party/colibrinano
          if [ "${{ matrix.platform }}" = "windows" ]; then
            URL="$BASE/x64/colibrinano_lib.dll"
            OUT=third_party/colibrinano/colibrinano_lib.dll
            WANT=8caa01142accc37b48dbc0fa7a1cf4c87e8c73ca2a1711d731a6d3cdc751c1dd
          else
            # Nel repository d'origine `libcolibrinano_lib.so` è un puntatore
            # di ventisette byte: il file vero è quello con la versione piena.
            URL="$BASE/linux64/libcolibrinano_lib.so.1.0.0"
            OUT=third_party/colibrinano/libcolibrinano_lib.so
            WANT=77717b068164a1db10f623450aae8b3f216dda93d9856112fe7096918f20f585
          fi

          curl -fsSL "$URL" -o "$OUT"
          GOT=$(sha256sum "$OUT" | cut -d' ' -f1)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::colibrinano_lib non è quella attesa"
            echo "  attesa:  $WANT"
            echo "  scaricata: $GOT"
            exit 1
          fi
          echo "colibrinano_lib verificata: $GOT"

      # Il motore della riduzione di rumore neurale. Il sorgente non sta nel
      # repository — è di Xiph, e un sorgente altrui versionato è un sorgente
      # che nessuno riguarda più — ma la licenza è BSD-3, che consente la
      # ridistribuzione anche in forma binaria: compilato dentro il nostro
      # eseguibile, ci può stare.
      #
      # Senza questo passo il pacchetto esce senza lo stadio neurale, e chi lo
      # installa non trova il filtro: è successo dalla 1.1.3 alla 1.1.8, e il
      # programma lo diceva in una riga di log che su Windows non legge
      # nessuno.
      #
      # Il commit è fissato: «l'ultimo disponibile» in un pacchetto pubblicato
      # significa che due release con lo stesso numero possono contenere due
      # motori diversi. I pesi del modello li verifica lo script del progetto
      # con lo sha256 che si porta dietro.
      - name: Motore neurale (RNNoise)
        shell: bash
        run: |
          RNNOISE_COMMIT=70f1d256acd4b34a572f999a05c87bf00b67730d
          git clone https://github.com/xiph/rnnoise third_party/rnnoise
          cd third_party/rnnoise

          # Il commit deve esserci: ripiegare sul ramo predefinito vorrebbe
          # dire pubblicare un motore diverso da quello provato, e non
          # accorgersene.
          git checkout --quiet "$RNNOISE_COMMIT"

          # Il download del modello con curl invece dello script del progetto,
          # che vuole wget: su MSYS2 e su macOS non c'è di serie, e installarlo
          # per un file solo è una dipendenza in più da mantenere.
          MODEL_HASH=$(cat model_version)
          MODEL="rnnoise_data-${MODEL_HASH}.tar.gz"
          curl -fsSL "https://media.xiph.org/rnnoise/models/${MODEL}" -o "$MODEL"

          # macOS non ha `sha256sum`: lo stesso conto lo fa `shasum -a 256`, e
          # un pacchetto non si prende senza verificarlo perché la piattaforma
          # chiama lo strumento con un altro nome.
          if command -v sha256sum >/dev/null 2>&1; then
            GOT=$(sha256sum "$MODEL" | cut -d' ' -f1)
          else
            GOT=$(shasum -a 256 "$MODEL" | cut -d' ' -f1)
          fi

          if [ "$GOT" != "$MODEL_HASH" ]; then
            echo "::error::i pesi di RNNoise non sono quelli attesi"
            echo "  atteso:    $MODEL_HASH"
            echo "  scaricato: $GOT"
            exit 1
          fi
          tar xzf "$MODEL"
          echo "RNNoise pronto: $(git rev-parse --short HEAD), modello verificato"

      # ── Build e installazione ───────────────────────────────────────────
      - name: Compila
        run: |
          QT_DEPLOY_ARG=""
          HAMLIB_RIGCTLD_ARG=""
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # Qt 6.11/macdeployqt has a broken CMake-generated QML plugin
            # symlink path on this runner; deploy the finished app explicitly.
            QT_DEPLOY_ARG="-DDSDR_QT_CMAKE_DEPLOY=OFF"
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Il runtime Hamlib include DLL che non devono precedere quelle
            # della toolchain MSYS2 nel PATH. Lo consegniamo a CMake con un
            # parametro dedicato, dopo aver convertito il percorso in forma
            # Windows per il binario CMake nativo.
            HAMLIB_RIGCTLD="$(cygpath -m "$PWD/third_party/hamlib-w64-4.7.2/bin/rigctld.exe")"
            HAMLIB_RIGCTLD_ARG="-DDSDR_RIGCTLD_BIN=$HAMLIB_RIGCTLD"
          fi
          # `DSDR_STRICT_BACKENDS`: qui si costruisce per altri, e un backend
          # che si spegne perché manca una dipendenza deve fermare la
          # costruzione. La 1.1.3 è uscita senza `audiorig` — niente CAT,
          # nessuna radio tradizionale — perché la riga che lo diceva era una
          # fra trecento e nessuno l'ha letta.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DDSDR_STRICT_BACKENDS=ON -DDSDR_BUNDLE_HAMLIB=ON \
                -DDSDR_BUNDLE_SOAPY=ON \
                -DDSDR_SOAPY_BUNDLE_MODULES="librtlsdrSupport;libHackRFSupport" \
                $QT_DEPLOY_ARG $HAMLIB_RIGCTLD_ARG
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # I runner ARM non avviano un server audio: senza un sink PulseAudio
          # i test di spettro, registrazione IQ e moduli ricevono zero frame.
          # Il server è usato esclusivamente in CI, non viene incluso nell'AppImage.
          if [ "${{ matrix.platform }}" = "linux" ]; then
            pulseaudio --start --exit-idle-time=-1
            pactl info
          fi
          # Su Windows la shell predefinita della matrice è MSYS2/MINGW64:
          # mantenerla qui è essenziale. Git Bash può trovare `ctest`, ma non
          # il runtime DLL con cui gli eseguibili sono stati compilati; il
          # risultato è una sequenza di timeout senza una diagnosi utile.
          # Questi due test coprono un eseguibile Qt GUI e uno app-less prima
          # della suite completa, così un problema del runtime fallisce subito
          # con il comando effettivo e l'output verboso.
          printf 'shell: %s\n' "$(command -v bash)"
          printf 'ctest: %s\n' "$(command -v ctest)"
          ctest --test-dir build --output-on-failure --verbose --timeout 60 \
            -R '^(tst_waterfall|tst_dsp_primitives)$'
          ctest --test-dir build --output-on-failure --timeout 180

      - name: Installa in staging
        shell: bash
        run: |
          # Il prefix deve essere assoluto: `qt6_deploy_qt_conf` rifiuta un
          # percorso relativo, e il messaggio arriva dopo che l'installazione
          # ha già copiato mezza Qt. Su MSYS2 serve anche la forma Windows,
          # perché cmake lì è un binario nativo.
          PREFIX="$(pwd)/staging"
          if command -v cygpath >/dev/null 2>&1; then
            PREFIX="$(cygpath -m "$PREFIX")"
          fi
          cmake --install build --prefix "$PREFIX"

          if [ "${{ matrix.platform }}" = "macos" ]; then
            macdeployqt "$PREFIX/decodium-sdr.app" \
              -qmldir="$PWD/src/app/qml" -no-codesign -always-overwrite
            cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -P build/BundleMacOSSoapyModules.cmake
            cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -P build/BundleMacOSHamlib.cmake
            # macdeployqt and the custom Soapy bundle step both rewrite Mach-O
            # files. Sign the complete nested-code graph in one operation:
            # signing every symlinked file first can sign the same Qt plug-in
            # through two paths and leaves the enclosing bundle inconsistent
            # on current macOS runners. A notarized release must replace this
            # ad-hoc pass with the corresponding Developer ID signing pass.
            codesign --force --deep --sign - "$PREFIX/decodium-sdr.app"
            codesign --verify --deep --strict --verbose=2 "$PREFIX/decodium-sdr.app"
          fi

      - name: I moduli Soapy sono nel pacchetto
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            bash scripts/check-soapy-package.sh staging/decodium-sdr.app \
              librtlsdrSupport libHackRFSupport
            if otool -L staging/decodium-sdr.app/Contents/lib/SoapySDR/modules0.8/* | \
                 grep -E '/(opt/homebrew|usr/local|opt/local)/'; then
              echo "::error::il bundle macOS conserva dipendenze del prefisso di sviluppo"
              exit 1
            fi
          else
            bash scripts/check-soapy-package.sh staging librtlsdrSupport libHackRFSupport
          fi

      # Il pacchetto Windows è l'unico che si costruisce dove tutte le
      # librerie sono già nel PATH: MSYS2 le fornisce a chiunque, e un
      # pacchetto incompleto parte lo stesso su questa macchina. Chi scopre
      # che mancano è l'utente, all'avvio, con il nome di una DLL che non gli
      # dice niente. Il controllo rifà quel percorso qui, dove costa un
      # secondo e non è ancora partito niente verso nessuno.
      - name: Il pacchetto Windows è autosufficiente
        if: matrix.platform == 'windows'
        run: bash scripts/check-windows-package.sh staging

      # ── Confezionamento ─────────────────────────────────────────────────
      - name: AppImage (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # AppDir con la struttura che linuxdeploy si aspetta.
          mkdir -p AppDir/usr
          cp -r staging/* AppDir/usr/

          # Qt Multimedia qui viene usato solo per QAudioSink, QAudioSource e
          # QMediaDevices. Il plugin `multimedia` invece è un player/video
          # backend e non è nel percorso audio SDR; linuxdeploy tenta di
          # raccogliere il suo grafo GStreamer, che su Ubuntu 24.04 non è
          # distribuibile in modo coerente fra x86-64 e ARM64. Il deploy
          # CMake deve però vederlo per completare; lo si esclude soltanto
          # dall'AppDir e dalla successiva scansione di linuxdeploy.
          rm -rf AppDir/usr/plugins/multimedia
          QT_PATHS_BIN="$(command -v qtpaths6 || command -v qtpaths)"
          QT_PLUGIN_DIR="$("$QT_PATHS_BIN" --query QT_INSTALL_PLUGINS)"
          test -d "$QT_PLUGIN_DIR/multimedia"
          rm -rf "$QT_PLUGIN_DIR/multimedia"

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/it.decodium.sdr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DECODIUM SDR
          Comment=Client SDR universale dell'ecosistema DECODIUM
          Exec=decodium-sdr
          Icon=it.decodium.sdr
          Categories=HamRadio;Network;AudioVideo;
          Terminal=false
          EOF

          # L'icona è un file versionato, non qualcosa che la CI debba saper
          # produrre: generarla al volo dipendeva da ImageMagick, che su
          # ubuntu-24.04 non c'è, e il ripiego lasciava un PNG di zero byte che
          # linuxdeploy rifiuta — dopo aver già fatto tutto il resto del lavoro.
          cp packaging/icons/it.decodium.sdr.png AppDir/usr/share/icons/hicolor/256x256/apps/

          ARCH="${{ matrix.arch }}"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH}.AppImage"
          chmod +x linuxdeploy*.AppImage

          export QML_SOURCES_PATHS="$PWD/src/app/qml"
          SOAPY_MODULE_ARGS=()
          while IFS= read -r source_module; do
            [ -z "$source_module" ] && continue
            staged_module="AppDir/usr/lib/SoapySDR/modules0.8/$(basename "$source_module")"
            test -f "$staged_module"
            SOAPY_MODULE_ARGS+=(--executable "$staged_module")
          done < build/dsdr-soapy-modules.txt
          "./linuxdeploy-${ARCH}.AppImage" --appdir AppDir --plugin qt \
            --output appimage --executable AppDir/usr/bin/decodium-sdr \
            --executable AppDir/usr/bin/rigctld \
            "${SOAPY_MODULE_ARGS[@]}" \
            --desktop-file AppDir/usr/share/applications/it.decodium.sdr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/it.decodium.sdr.png

          OUTPUT=$(find . -maxdepth 1 -type f -name 'DECODIUM*.AppImage' -print -quit)
          test -n "$OUTPUT"
          mv "$OUTPUT" "${{ matrix.artifact }}"

      - name: DMG (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # Solo `staging`: nella build tree c'è un secondo bundle, quello
          # appena linkato, in cui le librerie Qt non sono ancora entrate.
          # Prenderlo darebbe un DMG che si apre, mostra l'icona e non parte su
          # nessuna macchina che non abbia già Qt installato.
          APP=$(find staging -name "decodium-sdr.app" -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "::error::bundle .app non trovato in staging/"; exit 1
          fi

          bash scripts/check-soapy-package.sh "$APP" librtlsdrSupport libHackRFSupport
          test -x "$APP/Contents/Resources/hamlib/bin/rigctld"
          test -f "$APP/Contents/Frameworks/libhamlib.4.dylib"
          echo "SoapyRTLSDR, SoapyHackRF, Hamlib e runtime presenti nel bundle"

          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create -volname "DECODIUM SDR" -srcfolder dmgroot \
            -ov -format UDZO "${{ matrix.artifact }}"

          # Il DMG non è firmato né notarizzato: serve un Developer ID, che è
          # un passo amministrativo, non tecnico. Fino ad allora macOS
          # chiederà conferma all'apertura.
          echo "::warning::DMG non firmato: serve un Apple Developer ID per la notarizzazione"

      - name: Installer e ZIP (Windows)
        if: matrix.platform == 'windows'
        run: |
          # L'installatore lo fa CPack, dalla stessa regola di `install()` da
          # cui esce lo staging: due strade diverse per lo stesso contenuto
          # diventerebbero due pacchetti diversi al primo ritocco.
          cd build
          cpack -G "NSIS;ZIP"
          cd ..

          mv build/decodium-sdr-*-Windows-*.exe "${{ matrix.artifact }}"
          mv build/decodium-sdr-*-Windows-*.zip "DECODIUM_SDR_${DSDR_TAG}_windows-x64.zip"

      # L'installatore Inno Setup, lo stesso strumento con cui si confeziona
      # DECODIUM: chi installa i due programmi incontra la stessa procedura.
      # Si costruisce qui e non sulla macchina di chi sviluppa perché il
      # contenuto dev'essere quello di release — la build locale porta i
      # simboli di debug e pesa il doppio — e perché un pacchetto pubblicato
      # deve venire dallo stesso posto degli altri.
      #
      # ISCC è preinstallato sui runner Windows di GitHub. Il percorso è
      # quello di sistema e non passa dal PATH di MSYS2, che non lo conosce.
      - name: Installatore Inno Setup (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            echo "::error::Inno Setup non trovato sul runner"
            exit 1
          fi

          "$ISCC" //DStagingDir="$(cygpath -w "$(pwd)/staging")" \
                  //DAppVersion="$DSDR_VERSION" \
                  //DAppVersionName="$DSDR_NAME" \
                  packaging/windows/decodium-sdr.iss

          mv "packaging/windows/DECODIUM_SDR_${DSDR_TAG}_x64_Setup.exe" \
             "DECODIUM_SDR_${DSDR_TAG}_windows-x64-innosetup.exe"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: DECODIUM_SDR_${{ env.DSDR_TAG }}_windows-x64-innosetup.exe
          path: DECODIUM_SDR_${{ env.DSDR_TAG }}_windows-x64-innosetup.exe
          retention-days: 14

      - name: Carica anche lo ZIP portable (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: DECODIUM_SDR_${{ env.DSDR_TAG }}_windows-x64.zip
          path: DECODIUM_SDR_${{ env.DSDR_TAG }}_windows-x64.zip
          retention-days: 14

      # ── Verifica minima del pacchetto ───────────────────────────────────
      - name: Il pacchetto ha una dimensione plausibile
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"

          # `test -s` verificava solo che il file non fosse vuoto, e un DMG da
          # 900 kB — bundle senza una sola libreria Qt dentro — passava il
          # controllo per poi non partire su nessuna macchina. Un pacchetto che
          # si porta dietro Qt non può stare sotto i venti megabyte: la soglia
          # non dice che il contenuto è giusto, ma coglie il caso in cui manca
          # tutto, che è esattamente come falliscono questi passaggi.
          BYTES=$(wc -c < "${{ matrix.artifact }}")
          MIN=$((20 * 1024 * 1024))
          if [ "$BYTES" -lt "$MIN" ]; then
            echo "::error::pacchetto di soli $((BYTES / 1024)) kB: le librerie non ci sono"
            exit 1
          fi
          echo "$((BYTES / 1024 / 1024)) MB"

      # Il nome definitivo arriva qui e non nella matrice, che non puo'
      # leggere `CMakeLists.txt`. Un pacchetto scaricato finisce in una
      # cartella insieme ad altri dieci, e fra sei mesi «decodium-sdr-linux-
      # x86_64.AppImage» non dice a nessuno quale versione sia.
      - name: Il nome definitivo del pacchetto
        shell: bash
        run: |
          case "${{ matrix.artifact }}" in
            *.AppImage) FINAL="DECODIUM_SDR_${DSDR_TAG}_linux-${{ matrix.arch }}.AppImage" ;;
            *.dmg)      FINAL="DECODIUM_SDR_${DSDR_TAG}_macos-${{ matrix.arch }}.dmg" ;;
            *)          FINAL="DECODIUM_SDR_${DSDR_TAG}_windows-x64-setup.exe" ;;
          esac
          mv "${{ matrix.artifact }}" "$FINAL"
          echo "DSDR_FINAL=$FINAL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DSDR_FINAL }}
          path: ${{ env.DSDR_FINAL }}
          retention-days: 14

  publish:
    name: Pubblica la bozza di release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Il checkout serve solo a leggere il nome della versione da
      # `CMakeLists.txt`: senza, il passo qui sotto cerca un file che in questo
      # lavoro non c'e' mai stato.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Il nome della versione anche qui: il titolo della bozza e' la prima
      # cosa che si legge, e «v1.2.1» da solo non si ricorda.
      - name: Versione e nome
        shell: bash
        run: |
          NAME=$(sed -n 's/^[[:space:]]*set(DSDR_VERSION_NAME[[:space:]]*"\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)
          echo "DSDR_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Crea la bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }} «${{ env.DSDR_NAME }}»
          files: artifacts/*
          body_path: docs/GITHUB_RELEASE_BODY_1.2.5.md
